name: BEILEYS47 | V34 RPT read-only engine errors
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v34-rpt-readonly.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/v34_rpt_spawner_readonly.py
      - run: python scripts/v34_rpt_spawner_readonly.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEILEYS47_V34_RPT_AGGREGATES_ONLY
          path: deploy/v34/RPT_ERROR_COUNTS_ONLY.json
          retention-days: 2
          if-no-files-found: ignore

name: Publish long-lived recovery snapshot

# Automatically publish a new versioned backup on every reviewed main update.
# SHA-specific tags prevent overwriting older snapshots.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: beileys47-recovery-release-main
  cancel-in-progress: false

jobs:
  publish-snapshot:
    if: github.ref == 'refs/heads/main' && github.repository == 'kekko98kekko-dev/beileys47-dayz-server'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only this dedicated job can create a GitHub release.
    # The normal testing workflow retains contents: read.
    permissions:
      contents: write

    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project source and profile
        run: python scripts/validate.py

      - name: Build Stage 1/2 pinned Bohemia mission previews
        run: python scripts/build_stage2.py

      - name: Validate Stage 2 and its narrow approved change scope
        run: |
          python scripts/test_stage2.py
          python scripts/audit_stage2.py
          python scripts/check_release.py dist/stage2/beileys47-livonia-stage2-preview.zip

      - name: Build and independently test Stage 3
        run: |
          python scripts/build_stage3.py
          python scripts/test_stage3.py

      - name: Audit CE input guards and reproducible Stage 1-3 build dependencies
        run: |
          python scripts/test_ce_input_guards.py
          python scripts/test_stage3_dependency_refresh.py
          python scripts/test_zip_reproducibility.py

      - name: Generate safe read-only Nitrado plan
        run: python scripts/plan_nitrado.py

      - name: Verify Stage 4 object candidate provenance
        run: python scripts/audit_stage4_assets.py

      - name: Create blank survey and non-deployable ZONA 47 blueprint
        run: |
          python scripts/prepare_zone47_survey.py
          python scripts/build_stage4_concept.py
          python scripts/test_zone47_export_safety.py

      - name: Generate and test Livonia site/footprint screens
        run: |
          python scripts/scan_stage4_sites.py
          python scripts/test_stage4_sites.py
          python scripts/assess_stage4_footprints.py
          python scripts/test_stage4_footprints.py

      - name: Generate and test Stage 4.4 X/Z-only terrain survey worksheet
        run: |
          python scripts/build_stage4_terrain_survey_grid.py
          python scripts/test_stage4_terrain_grid.py

      - name: Generate empty Stage 4.5 height datasets and verify importer safety
        run: |
          python scripts/prepare_stage4_height_capture.py
          python scripts/test_stage4_height_samples.py

      - name: Validate optional PC SurfaceY snippet and log-importer with synthetic data
        run: python scripts/test_stage4_surfacey_capture.py

      - name: Validate center-based Stage 4.6 pilot and Object Spawner guardrails
        run: |
          python scripts/build_stage4_6_pilot_preflight.py
          python scripts/test_stage4_6_pilot_preflight.py

      - name: Audit PvP graph routes and two-sector lockdown regression
        run: |
          python scripts/stress_test_stage4_pvp_routes.py
          python scripts/test_stage4_pvp_routes.py

      - name: Check Stage 4.8 PlayStation field-survey waypoint consistency
        run: |
          python scripts/build_stage4_8_field_recon.py
          python scripts/test_stage4_8_field_recon.py

      - name: Verify Stage 4.9 model bounding boxes and proposed non-deployable pilot
        run: |
          python scripts/assess_stage4_9_visual_envelopes.py
          python scripts/test_stage4_9_visual_envelopes.py

      - name: Review all 26 Stage 4.10 schematic props and unknown model sizes
        run: |
          python scripts/audit_stage4_10_all_placements.py
          python scripts/test_stage4_10_all_placements.py

      - name: Check Stage 4.11 role-model metadata and forbidden direct P3D spawn paths
        run: |
          python scripts/assess_stage4_11_role_model_options.py
          python scripts/test_stage4_11_role_model_options.py

      - name: Generate privacy-safe Stage 4.12 offline RPT evidence templates only
        run: |
          python scripts/build_stage4_12_evidence.py
          python scripts/test_stage4_12_evidence.py

      - name: Check stable 1.30 source provenance (not console runtime)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_stage4_release_gate.py
          python scripts/test_stage4_release_gate.py

      - name: Check Stage 4.13 progressive console trial gates
        run: |
          python scripts/build_stage4_13_console_pilot.py
          python scripts/audit_stage4_13_console_pilot.py
          python scripts/test_stage4_13_console_pilot.py

      - name: Assemble and test pre-purchase six-file Livonia review bundle
        run: |
          python scripts/build_prepurchase_bundle.py
          python scripts/test_prepurchase_bundle.py

      - name: Generate and independently test Stage 5 static gameplay balance report
        run: |
          python scripts/build_stage5_balance.py
          python scripts/test_stage5_balance.py

      - name: Validate Stage 6 bunker, infected, CE loot and restart design safety
        run: |
          python scripts/build_stage6_special_zones.py
          python scripts/test_stage6_special_zones.py

      - name: Generate and test Stage 7 bunker concept and static graph (NO DEPLOY)
        run: |
          python scripts/build_stage7_bunker.py
          python scripts/test_stage7_bunker.py

      - name: Review Stage 8 PS5 bunker class evidence and risky exit behavior
        run: |
          python scripts/build_stage8_feasibility.py
          python scripts/test_stage8_feasibility.py

      - name: Generate the complete recovery archive
        run: python scripts/make_recovery_kit.py

      - name: Test full offline recovery round-trip before publishing snapshot
        run: python scripts/test_recovery_restore.py

      - name: Deep audit every nested archive and exact master source bytes
        run: python scripts/test_all_nested_zip_reproducibility.py

      - name: Validate recovery ZIP and create checksum
        shell: bash
        run: |
          set -euo pipefail
          python -m zipfile -t dist/beileys47-recovery-kit.zip
          test -s dist/beileys47-recovery-kit.zip
          sha256sum dist/beileys47-recovery-kit.zip > dist/beileys47-recovery-kit.zip.sha256
          sha256sum --check dist/beileys47-recovery-kit.zip.sha256
          python -m zipfile -t dist/prepurchase/beileys47-livonia-mission-review-candidate.zip
          sha256sum dist/prepurchase/beileys47-livonia-mission-review-candidate.zip > dist/prepurchase/beileys47-livonia-mission-review-candidate.zip.sha256
          sha256sum --check dist/prepurchase/beileys47-livonia-mission-review-candidate.zip.sha256

      - name: Publish or re-verify this commit's GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="snapshot-${GITHUB_SHA:0:12}"
          ZIP="dist/beileys47-recovery-kit.zip"
          HASH="dist/beileys47-recovery-kit.zip.sha256"
          REVIEW="dist/prepurchase/beileys47-livonia-mission-review-candidate.zip"
          REVIEW_HASH="dist/prepurchase/beileys47-livonia-mission-review-candidate.zip.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing snapshot $TAG: verifying stored ZIP instead of rewriting."
          else
            gh release create "$TAG" "$ZIP" "$HASH" "$REVIEW" "$REVIEW_HASH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "BEILEYS47 Recovery Snapshot • ${GITHUB_SHA:0:12}" \
              --notes-file docs/RELEASE_SNAPSHOT.md \
              --prerelease
          fi

          mkdir -p "$RUNNER_TEMP/verify-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "beileys47-recovery-kit.zip" \
            --dir "$RUNNER_TEMP/verify-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "beileys47-recovery-kit.zip.sha256" \
            --dir "$RUNNER_TEMP/verify-release"
          cmp "$ZIP" "$RUNNER_TEMP/verify-release/beileys47-recovery-kit.zip"
          cmp "$HASH" "$RUNNER_TEMP/verify-release/beileys47-recovery-kit.zip.sha256"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "beileys47-livonia-mission-review-candidate.zip" \
            --dir "$RUNNER_TEMP/verify-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "beileys47-livonia-mission-review-candidate.zip.sha256" \
            --dir "$RUNNER_TEMP/verify-release"
          cmp "$REVIEW" "$RUNNER_TEMP/verify-release/beileys47-livonia-mission-review-candidate.zip"
          cmp "$REVIEW_HASH" "$RUNNER_TEMP/verify-release/beileys47-livonia-mission-review-candidate.zip.sha256"
          echo "PASS: GitHub Release $TAG contains the exact verified recovery archive."
          echo "This is a source/project backup, not a backup of live DayZ characters or Nitrado persistence."

name: BEILEYS47 | V47 GET-only emergency remote file health
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v47-live-safety-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/v47_live_readonly_safety.py
      - run: python scripts/v47_live_readonly_safety.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEILEYS47_V47_REMOTE_EMERGENCY_GET_ONLY
          path: deploy/v47/POST_FAILURE_READONLY_STATE.json
          retention-days: 3
          if-no-files-found: ignore

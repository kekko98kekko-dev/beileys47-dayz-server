name: BEILEYS47 | V52 post-recovery engine RPT check GET-only
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v52-post-recovery-rpt-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpt-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile read-only engine RPT aggregation
        run: python -m py_compile scripts/v34_rpt_spawner_readonly.py
      - name: Check object-spawn failure counters without publishing raw logs
        run: python scripts/v34_rpt_spawner_readonly.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEILEYS47_V52_POST_RESTORE_RPT_AGGREGATES_ONLY
          path: deploy/v34/RPT_ERROR_COUNTS_ONLY.json
          retention-days: 2
          if-no-files-found: ignore

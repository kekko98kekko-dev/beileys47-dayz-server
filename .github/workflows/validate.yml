name: Validate DayZ Livonia Stages 1–4 and site-screening previews

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project profile and mission XML/JSON
        run: python scripts/validate.py

      - name: Build both stages from pinned Bohemia official files
        run: python scripts/build_stage2.py

      - name: Regression tests on generated configurations
        run: python scripts/test_stage2.py

      - name: Build Stage 3 encounter/identity preview (NO deployment)
        run: python scripts/build_stage3.py

      - name: Verify Stage 3 event scope, messages and archive
        run: python scripts/test_stage3.py

      - name: Independent approved-change audit against official Bohemia files
        run: python scripts/audit_stage2.py

      - name: Strict Stage 2 preview release checks
        run: python scripts/check_release.py dist/stage2/beileys47-livonia-stage2-preview.zip

      - name: Generate read-only Nitrado preflight (NO provider access)
        run: python scripts/plan_nitrado.py

      - name: Verify generated ZIP integrity and reports
        run: |
          python -m zipfile -t dist/stage1/beileys47-livonia-stage1.zip
          python -m zipfile -t dist/stage2/beileys47-livonia-stage2-preview.zip
          python -m zipfile -t dist/stage3/beileys47-livonia-stage3-preview.zip
          python -m json.tool dist/stage1/change_report.json > /dev/null
          python -m json.tool dist/stage2/change_report.json > /dev/null
          python -m json.tool dist/stage3/change_report.json > /dev/null

      - name: Confirm Stage 4 candidate asset names in pinned Livonia terrain groups
        run: python scripts/audit_stage4_assets.py

      - name: Generate empty Stage 4 real-terrain survey worksheet
        run: python scripts/prepare_zone47_survey.py

      - name: Validate and render Stage 4 ZONA 47 tactical concept (NO DEPLOY)
        run: python scripts/build_stage4_concept.py

      - name: Test Stage 4 Object Spawner export safety (synthetic fixtures only)
        run: python scripts/test_zone47_export_safety.py

      - name: Verify Stage 4 concept archive integrity
        run: |
          python -m zipfile -t dist/stage4/beileys47-zone47-design-only.zip
          python -m json.tool dist/stage4/concept_audit.json > /dev/null

      - name: Screen three Livonia regions against pinned terrain, player spawns and event points
        run: python scripts/scan_stage4_sites.py

      - name: Regression test provisional site coordinates against pinned source points
        run: python scripts/test_stage4_sites.py

      - name: Compare full 240x220m prototype rectangles with static Livonia source anchors
        run: python scripts/assess_stage4_footprints.py

      - name: Regression-test rectangular geometry and candidate gates
        run: python scripts/test_stage4_footprints.py

      - name: Build offline recovery kit and verify SHA-256 manifest
        run: python scripts/make_recovery_kit.py

      - name: Upload Stage 1 preview (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-stage1-preview
          path: |
            dist/stage1/beileys47-livonia-stage1.zip
            dist/stage1/change_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 2 preview (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-stage2-preview
          path: |
            dist/stage2/beileys47-livonia-stage2-preview.zip
            dist/stage2/change_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 3 preview (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-stage3-preview
          path: |
            dist/stage3/beileys47-livonia-stage3-preview.zip
            dist/stage3/change_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4 ZONA 47 conceptual layout (NOT GAME FILES)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-concept
          path: |
            dist/stage4/beileys47-zone47-design-only.zip
            dist/stage4/zone47_layout.svg
            dist/stage4/concept_audit.json
            dist/stage4/asset_evidence.json
            dist/stage4/zone47_survey_template.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.1 provisional site candidates (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-site-screen
          path: |
            dist/stage4_site_screening/site_screen_report.json
            dist/stage4_site_screening/site_screen_scatter.svg
            dist/stage4_site_screening/beileys47-zone47-site-screen-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.2 full-footprint proxy screening (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-footprint-screen
          path: |
            dist/stage4_footprint/footprint_report.json
            dist/stage4_footprint/footprint_rectangles.svg
            dist/stage4_footprint/beileys47-zone47-footprint-screen-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload complete offline recovery kit (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-recovery-kit
          path: dist/beileys47-recovery-kit.zip
          if-no-files-found: error
          retention-days: 90

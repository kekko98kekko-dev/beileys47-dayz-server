name: Validate DayZ Livonia Stage 1 and Stage 2 previews

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project profile and mission XML/JSON
        run: python scripts/validate.py

      - name: Build both stages from pinned Bohemia official files
        run: python scripts/build_stage2.py

      - name: Regression tests on generated configurations
        run: python scripts/test_stage2.py

      - name: Strict Stage 2 preview release checks
        run: python scripts/check_release.py dist/stage2/beileys47-livonia-stage2-preview.zip

      - name: Verify generated ZIP integrity and reports
        run: |
          python -m zipfile -t dist/stage1/beileys47-livonia-stage1.zip
          python -m zipfile -t dist/stage2/beileys47-livonia-stage2-preview.zip
          python -m json.tool dist/stage1/change_report.json > /dev/null
          python -m json.tool dist/stage2/change_report.json > /dev/null

      - name: Upload Stage 1 preview (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-stage1-preview
          path: |
            dist/stage1/beileys47-livonia-stage1.zip
            dist/stage1/change_report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Stage 2 preview (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-stage2-preview
          path: |
            dist/stage2/beileys47-livonia-stage2-preview.zip
            dist/stage2/change_report.json
          if-no-files-found: error
          retention-days: 7

name: Validate DayZ Livonia Stages 1–4 and site-screening previews

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project profile and mission XML/JSON
        run: python scripts/validate.py

      - name: Build both stages from pinned Bohemia official files
        run: python scripts/build_stage2.py

      - name: Regression tests on generated configurations
        run: python scripts/test_stage2.py

      - name: Build Stage 3 encounter/identity preview (NO deployment)
        run: python scripts/build_stage3.py

      - name: Verify Stage 3 event scope, messages and archive
        run: python scripts/test_stage3.py

      - name: Independent approved-change audit against official Bohemia files
        run: python scripts/audit_stage2.py

      - name: Strict Stage 2 preview release checks
        run: python scripts/check_release.py dist/stage2/beileys47-livonia-stage2-preview.zip

      - name: Audit CE input guards and reproducible Stage 1-3 build dependencies
        run: |
          python scripts/test_ce_input_guards.py
          python scripts/test_stage3_dependency_refresh.py
          python scripts/test_zip_reproducibility.py

      - name: Generate read-only Nitrado preflight (NO provider access)
        run: python scripts/plan_nitrado.py

      - name: Verify generated ZIP integrity and reports
        run: |
          python -m zipfile -t dist/stage1/beileys47-livonia-stage1.zip
          python -m zipfile -t dist/stage2/beileys47-livonia-stage2-preview.zip
          python -m zipfile -t dist/stage3/beileys47-livonia-stage3-preview.zip
          python -m json.tool dist/stage1/change_report.json > /dev/null
          python -m json.tool dist/stage2/change_report.json > /dev/null
          python -m json.tool dist/stage3/change_report.json > /dev/null

      - name: Confirm Stage 4 candidate asset names in pinned Livonia terrain groups
        run: python scripts/audit_stage4_assets.py

      - name: Generate empty Stage 4 real-terrain survey worksheet
        run: python scripts/prepare_zone47_survey.py

      - name: Validate and render Stage 4 ZONA 47 tactical concept (NO DEPLOY)
        run: python scripts/build_stage4_concept.py

      - name: Test Stage 4 Object Spawner export safety (synthetic fixtures only)
        run: python scripts/test_zone47_export_safety.py

      - name: Verify Stage 4 concept archive integrity
        run: |
          python -m zipfile -t dist/stage4/beileys47-zone47-design-only.zip
          python -m json.tool dist/stage4/concept_audit.json > /dev/null

      - name: Screen three Livonia regions against pinned terrain, player spawns and event points
        run: python scripts/scan_stage4_sites.py

      - name: Regression test provisional site coordinates against pinned source points
        run: python scripts/test_stage4_sites.py

      - name: Compare full 240x220m prototype rectangles with static Livonia source anchors
        run: python scripts/assess_stage4_footprints.py

      - name: Regression-test rectangular geometry and candidate gates
        run: python scripts/test_stage4_footprints.py

      - name: Verify pinned DayZ 1.30 official stable CE release provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_stage4_release_gate.py

      - name: Prove console compatibility gate stays blocked without real Nitrado tests
        run: python scripts/test_stage4_release_gate.py

      - name: Build X/Z-only Stage 4.4 terrain survey worksheets (NO measured ground Y)
        run: python scripts/build_stage4_terrain_survey_grid.py

      - name: Validate centered coordinates and empty terrain elevation fields
        run: python scripts/test_stage4_terrain_grid.py

      - name: Build EMPTY Stage 4.5 real DayZ terrain-height capture manifests
        run: python scripts/prepare_stage4_height_capture.py

      - name: Test height audit using isolated synthetic samples and fail-closed real data gate
        run: python scripts/test_stage4_height_samples.py

      - name: Verify optional PC SurfaceY example and synthetic log converter
        run: python scripts/test_stage4_surfacey_capture.py

      - name: Validate Stage 4.6 official Object Spawner world-center contract and five-prop plan
        run: |
          python scripts/build_stage4_6_pilot_preflight.py
          python scripts/test_stage4_6_pilot_preflight.py

      - name: Stress-test conceptual PvP routes against single and double sector lockdown
        run: |
          python scripts/stress_test_stage4_pvp_routes.py
          python scripts/test_stage4_pvp_routes.py

      - name: Generate Stage 4.8 PlayStation X/Z reconnaissance guide (NO real Y)
        run: |
          python scripts/build_stage4_8_field_recon.py
          python scripts/test_stage4_8_field_recon.py

      - name: Assess Stage 4.9 P3D visual bounding boxes and five-prop conceptual corridor
        run: |
          python scripts/assess_stage4_9_visual_envelopes.py
          python scripts/test_stage4_9_visual_envelopes.py

      - name: Audit Stage 4.10 all 26 object symbols, 325 pairwise visual risks
        run: |
          python scripts/audit_stage4_10_all_placements.py
          python scripts/test_stage4_10_all_placements.py

      - name: Audit Stage 4.11 all 17 new source-backed visual model options
        run: |
          python scripts/assess_stage4_11_role_model_options.py
          python scripts/test_stage4_11_role_model_options.py

      - name: Test Stage 4.12 RPT diagnostics and empty class-evidence ledger
        run: |
          python scripts/build_stage4_12_evidence.py
          python scripts/test_stage4_12_evidence.py

      - name: Create and check Stage 4.13 empty console pilot 1→3→5 acceptance packet
        run: |
          python scripts/build_stage4_13_console_pilot.py
          python scripts/audit_stage4_13_console_pilot.py
          python scripts/test_stage4_13_console_pilot.py

      - name: Check pre-purchase Livonia six-file handoff integrity and safe exclusions
        run: |
          python scripts/build_prepurchase_bundle.py
          python scripts/test_prepurchase_bundle.py

      - name: Build offline recovery kit and verify SHA-256 manifest
        run: python scripts/make_recovery_kit.py

      - name: Test verified offline Recovery Kit restoration (corruption and overwrite guards)
        run: python scripts/test_recovery_restore.py

      - name: Deep audit every nested archive and exact master source bytes
        run: python scripts/test_all_nested_zip_reproducibility.py

      - name: Upload Stage 1 preview (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-stage1-preview
          path: |
            dist/stage1/beileys47-livonia-stage1.zip
            dist/stage1/change_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 2 preview (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-stage2-preview
          path: |
            dist/stage2/beileys47-livonia-stage2-preview.zip
            dist/stage2/change_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 3 preview (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-stage3-preview
          path: |
            dist/stage3/beileys47-livonia-stage3-preview.zip
            dist/stage3/change_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4 ZONA 47 conceptual layout (NOT GAME FILES)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-concept
          path: |
            dist/stage4/beileys47-zone47-design-only.zip
            dist/stage4/zone47_layout.svg
            dist/stage4/concept_audit.json
            dist/stage4/asset_evidence.json
            dist/stage4/zone47_survey_template.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.1 provisional site candidates (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-site-screen
          path: |
            dist/stage4_site_screening/site_screen_report.json
            dist/stage4_site_screening/site_screen_scatter.svg
            dist/stage4_site_screening/beileys47-zone47-site-screen-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.2 full-footprint proxy screening (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-footprint-screen
          path: |
            dist/stage4_footprint/footprint_report.json
            dist/stage4_footprint/footprint_rectangles.svg
            dist/stage4_footprint/beileys47-zone47-footprint-screen-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload official source-compatibility review (NO DEPLOY)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-ce-stable-compatibility-gate
          path: dist/compatibility/stage4_release_gate_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.4 unmeasured-Y terrain survey templates (NOT GAME FILES)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-terrain-survey-grid
          path: |
            dist/stage4_terrain_survey/terrain_survey_grid.json
            dist/stage4_terrain_survey/central_empty_Y_grid.csv
            dist/stage4_terrain_survey/southern_west_empty_Y_grid.csv
            dist/stage4_terrain_survey/southern_east_empty_Y_grid.csv
            dist/stage4_terrain_survey/central_xz_survey.svg
            dist/stage4_terrain_survey/beileys47-zone47-terrain-survey-worksheet-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.5 height capture templates (ZERO actual measurements)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-height-capture
          path: |
            dist/stage4_height_capture/central_surfaceY_empty.json
            dist/stage4_height_capture/southern_west_surfaceY_empty.json
            dist/stage4_height_capture/southern_east_surfaceY_empty.json
            dist/stage4_height_capture/terrain_height_audit.json
            dist/stage4_height_capture/central_surfaceY_pc_runtime_example.c
            dist/stage4_height_capture/beileys47-zone47-height-capture-templates-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload non-installable Stage 4.6 five-prop pilot plan
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-micro-pilot-plan
          path: |
            dist/stage4_6_preflight/zone47_micro_pilot_plan.json
            dist/stage4_6_preflight/beileys47-micro-pilot-plan-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.7 conceptual PvP route resilience report
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-pvp-route-stress
          path: |
            dist/stage4_7_route_balance/pvp_route_stress_report.json
            dist/stage4_7_route_balance/sector_lockout_matrix.csv
            dist/stage4_7_route_balance/beileys47-route-stress-design-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.8 unverified field reconnaissance dossier
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-zone47-field-recon
          path: |
            dist/stage4_8_field_recon/central_field_recon.json
            dist/stage4_8_field_recon/central_waypoints.csv
            dist/stage4_8_field_recon/central_route_links.csv
            dist/stage4_8_field_recon/beileys47-world-xz-field-guide-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.9 P3D visual-envelope model survey (NOT COLLISION PROOF)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-stage49-model-visual-clearance
          path: |
            dist/stage4_9_visual_envelopes/pilot_visual_clearance_report.json
            dist/stage4_9_visual_envelopes/beileys47-visual-clearance-not-deployable.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.10 full schematic 26-object audit (NOT COLLISION TESTED)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-stage410-26-object-review
          path: |
            dist/stage4_10_full_layout/full_26_layout_risk_report.json
            dist/stage4_10_full_layout/all_26_placement_review.csv
            dist/stage4_10_full_layout/all_325_pair_review.csv
            dist/stage4_10_full_layout/beileys47-full-layout-paper-audit-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.11 unverified role-matched P3D visual-reference model catalog
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-stage411-role-matched-visual-candidates
          path: |
            dist/stage4_11_role_catalog/candidate_26_visual_fit_report.json
            dist/stage4_11_role_catalog/all_26_visual_candidate_sizes.csv
            dist/stage4_11_role_catalog/reference_pair_warnings.csv
            dist/stage4_11_role_catalog/beileys47-stage411-visual-role-options-not-deployable.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.12 privacy-safe EMPTY server-RPT audit (NO real logs)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-stage412-rpt-triage-no-logs
          path: |
            dist/stage4_12_rpt_diagnostics/class_evidence_no_runtime.json
            dist/stage4_12_rpt_diagnostics/rpt_triage_no_logs.json
            dist/stage4_12_rpt_diagnostics/beileys47-spawner-log-preflight-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Stage 4.13 blank console pilot acceptance template only
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-stage413-blank-PS5-acceptance
          path: |
            dist/stage4_13_console_pilot/blank_1_3_5_console_trial.json
            dist/stage4_13_console_pilot/console_pilot_no_evidence_audit.json
            dist/stage4_13_console_pilot/beileys47-console-pilot-templates-only.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload six-file pre-purchase candidate and manual review gate
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-livonia-prepurchase-candidate-NOT-TESTED
          path: |
            dist/prepurchase/beileys47-livonia-mission-review-candidate.zip
            dist/prepurchase/purchase_day_gate.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload complete offline recovery kit (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: beileys47-recovery-kit
          path: dist/beileys47-recovery-kit.zip
          if-no-files-found: error
          retention-days: 90

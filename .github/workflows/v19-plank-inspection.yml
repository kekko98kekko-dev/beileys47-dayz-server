name: BEILEYS47 | 15-day plank inspection reminder (NO Nitrado edits)
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v19-plank-inspection.yml"
      - "scripts/v19_plank_maintenance.py"
      - "scripts/test_v19_plank_maintenance.py"
permissions:
  contents: read
  issues: write
concurrency:
  group: BEILEYS47-v19-plank-issues
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/v19_plank_maintenance.py
      - run: python scripts/test_v19_plank_maintenance.py
  reminder:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/v19_plank_maintenance.py --post

name: BEILEYS47 | V16 guarded rollout
on:
  push:
    paths:
      - "deploy/v16/GO_LIVE.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: BEILEYS47-V16-ONE-TIME
  cancel-in-progress: false
jobs:
  preflight:
    name: Validate real Nitrado V15 files without writing
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
      BEILEYS47_V16_MODE: "preflight"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m py_compile scripts/nitrado_snapshot.py scripts/deploy_beileys47_v15.py scripts/deploy_beileys47_v16.py
      - name: Validate 8 V16 output files without writing
        run: python scripts/deploy_beileys47_v16.py

  install:
    name: Deploy validated V16 only if zero players and verify Nitrado restart
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
      BEILEYS47_V16_MODE: "deploy"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlled install, verified file hashes, no wipe
        run: python scripts/deploy_beileys47_v16.py
      - name: Upload per-file factual installation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEILEYS47_V16_INSTALL_RESULT
          path: deploy/v16/APPLY_RESULT.json
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish actual deployment outcome to GitHub
    if: always()
    needs: [preflight, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Record factual result for ChatGPT inspection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CHECK: ${{ needs.preflight.result }}
          APPLY: ${{ needs.install.result }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,base64
          result={"service_id":20113048,"version":"V16","preflight":os.environ["CHECK"],
                  "install":os.environ["APPLY"],
                  "installed_according_to_workflow":os.environ["APPLY"]=="success",
                  "ps5_tested":False,"wipe":False,"run_id":os.environ["RUN_ID"]}
          url="https://api.github.com/repos/"+os.environ["REPO"]+"/contents/deploy/v16/WORKFLOW_RESULT.json"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json",
                   "Content-Type":"application/json","User-Agent":"BEILEYS47-v16"}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:sha=json.load(r)["sha"]
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          body={"message":"Record actual V16 rollout result",
                "content":base64.b64encode((json.dumps(result,indent=2)+"\n").encode()).decode()}
          if sha:body["sha"]=sha
          req=urllib.request.Request(url,headers=headers,data=json.dumps(body).encode(),method="PUT")
          with urllib.request.urlopen(req,timeout=30) as r:print("Result published",r.status)
          PY

name: BEILEYS47 | V62 Diagnose missing Gunter GET-only no restart
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v62-gunter-absent-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run strict read-only vehicle absence diagnosis
        run: |
          python -m py_compile scripts/v62_gunter_absent_readonly.py
          python scripts/v62_gunter_absent_readonly.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEILEYS47_V62_READONLY_GUNTER_DIAGNOSTIC
          path: deploy/v62/GUNTER_DIAGNOSTIC_GET_ONLY.json
          retention-days: 5
          if-no-files-found: ignore

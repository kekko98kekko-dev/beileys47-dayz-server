name: BEILEYS47 | V18 read-only live baseline
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v18-preflight.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/v18_live_preflight.py
      - run: python scripts/v18_live_preflight.py
      - name: Verify independent V18 post-deploy key and V16 invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open("deploy/v18/LIVE_PREFLIGHT.json",encoding="utf-8"))
          assert d["status"] in {"started","running"}
          assert d["v16_registered"] and d["v16_scene_props"]==32
          assert d["dolnik_tents"]==2
          assert d["med_tent_lootmax"]=="10" and d["mil_tent_lootmax"]=="8"
          orange=d["rare_objects"]["GunCaseKeys_Orange"]
          assert orange["nominal"]==2 and orange["minimum"]==1
          assert d["rare_objects"]["GunCase_Orange"]["nominal"]==2
          assert d["rare_objects"]["GunCaseKeys_Blue"]["nominal"]==2
          assert d["rare_objects"]["GunCaseKeys_Red"]["nominal"]==2
          assert d["night_multiplier"] in {8,"8","8.0"}
          assert d["heli_nominal"]=="5" and d["convoy_nominal"]=="5"
          print("POSTDEPLOY VERIFIED: orange case keys, V16 scenery, Dolnik, weather and events; no console gameplay claim.")
          stamina=d["v20_sprint_settings"]
          movement=d["v20_movement_settings"]
          assert stamina["sprintStaminaModifierErc"]==0
          assert stamina["sprintStaminaModifierCro"]==0
          assert stamina["staminaKgToStaminaPercentPenalty"]==0
          assert movement["timeToSprint"]==0.01
          assert movement["timeToStrafeSprint"]==0.01
          assert d["gameplay_json_switch"]!="disabled"
          print("V20 READBACK VERIFIED: sprint drains=0, weight penalty=0, sprint transitions=0.01; gameplay toggle:",d["gameplay_json_switch"],"; PS5 test still pending.")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEILEYS47_V18_READONLY_BASELINE
          path: deploy/v18/LIVE_PREFLIGHT.json
          retention-days: 2
          if-no-files-found: ignore
